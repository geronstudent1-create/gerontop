<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мусор Дроп — Мини-игра</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            background: radial-gradient(circle, #161026 0%, #0c0914 100%);
            border: 2px solid var(--accent-purple);
            border-radius: 14px;
            box-shadow: 0 0 35px rgba(139, 61, 255, 0.3);
            max-width: 100%;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">МУСОР<span>ДРОП</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="cases.html">Ящики</a></li>
                <li><a href="knives.html">Ножи</a></li>
                <li><a href="game.html" class="active">Мини-игра</a></li>
                <li><a href="account.html">Аккаунт</a></li>
            </ul>
        </div>
    </header>

    <main class="game-wrapper">
        <h1 style="margin-bottom: 8px; font-size: 28px;">Рейд Ножа</h1>
        <p style="color: var(--text-muted); margin-bottom: 20px; text-align: center;">Управляй ножом-кораблем и уничтожай вражеские дроны!</p>

        <div class="game-info">
            <div>Счет: <span id="score" style="color: var(--accent-purple);">0</span></div>
            <div>Жизни: <span id="lives" style="color: #ff4757;">♥♥♥</span></div>
        </div>

        <canvas id="gameCanvas" width="600" height="400"></canvas>

        <p style="color: var(--text-muted); margin-top: 15px; font-size: 14px; text-align: center;">
            Управление: <b>A / D</b> или <b>Стрелки</b> — движение. <b>Пробел</b> или <b>Клик</b> — стрельба.
        </p>
    </main>

    <footer>
        <p>&copy; 2026 Мусор Дроп. Все права защищены.</p>
    </footer>

    <script src="game.js"></script>
</body>
</html>
